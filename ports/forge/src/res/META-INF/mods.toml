modLoader = "javafml"
loaderVersion = "[1,)"
license = "All Rights Reserved"
issueTrackerURL = "https://github.com/CosmicLogic0/villager-reroller/issues"

[[mods]]
modId = "villagerreroller"
version = "${version}"
displayName = "Villager Reroller"
authors = "CosmicLogic"
displayURL = "https://github.com/CosmicLogic0/villager-reroller"
logoFile = "assets/villagerreroller/icon.png"
# Client-side only: servers don't need it, and it works on any server.
displayTest = "IGNORE_ALL_VERSION"
description = """
Automatically rerolls a librarian's trades (break and replace the lectern) until it offers the enchanted book you want at a price you accept. Client-side, with an in-game menu.
"""

[[dependencies.villagerreroller]]
modId = "${loaderId}"
${mandatory}
versionRange = "[${loaderMajor},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.villagerreroller]]
modId = "minecraft"
${mandatory}
versionRange = "${mcRange}"
ordering = "NONE"
side = "CLIENT"
