plugins {
    // Minecraft 26.x is unobfuscated, so this uses Loom's non-remapping plugin (no mappings, no modImplementation).
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// jar name carries the loader and Minecraft version, e.g. villager-reroller-1.0.0+fabric-26.3.jar
version = "${project.mod_version}+fabric-${project.minecraft_version}"
// which Minecraft versions the jar may load on: "~26.1" = 26.1 and its 26.1.x updates
def mcDep = project.findProperty('mc_dep') ?: "~${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories for extra dependencies here.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Minecraft 26.1.x: the open screen still lives on Minecraft itself (mc.screen / mc.setScreen), not on mc.gui.
// Build from a copy of the sources with those few calls renamed.
def oldScreenApi = project.minecraft_version.toString().startsWith('26.1')
if (oldScreenApi) {
    def gen = layout.buildDirectory.dir('gen-src')
    tasks.register('oldScreenSources', Sync) {
        from 'src/main/java'
        into gen
        filter { String l -> l.replace('.gui.screen()', '.screen').replace('.gui.setScreen(', '.setScreen(') }
    }
    sourceSets.main.java.srcDirs = [gen]
    compileJava.dependsOn 'oldScreenSources'
    tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn 'oldScreenSources' }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcDep", mcDep
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version, "mcdep": mcDep
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    // Minecraft 26.3 requires Java 25.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}
