# Prints real Minecraft 26.3 class signatures (javap) so code can be written against them. Run manually.
name: API probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - run: gradle compileJava --no-daemon
      - name: javap
        run: |
          J=$(find ~/.gradle/caches -name '*.jar' -path '*minecraft*' -size +10M | xargs -I{} sh -c 'unzip -l "{}" 2>/dev/null | grep -q "net/minecraft/client/Minecraft.class" && echo "{}"' | head -1)
          echo "JAR=$J"
          for c in \
            net.minecraft.client.multiplayer.ClientLevel \
            net.minecraft.world.level.Level \
            net.minecraft.world.level.storage.LevelData \
            net.minecraft.client.multiplayer.MultiPlayerGameMode \
            net.minecraft.network.protocol.game.ServerboundPlayerActionPacket \
            'net.minecraft.network.protocol.game.ServerboundPlayerActionPacket$Action' \
            net.minecraft.network.protocol.game.ServerboundSwingPacket \
            net.minecraft.client.multiplayer.ClientPacketListener \
            net.minecraft.client.KeyMapping \
            net.minecraft.client.Options \
            net.minecraft.world.entity.player.Player \
            net.minecraft.world.entity.LivingEntity \
            net.minecraft.world.level.block.BedBlock \
            net.minecraft.client.gui.components.EditBox \
            net.minecraft.client.gui.screens.Screen \
            net.minecraft.world.level.block.state.BlockBehaviour\$BlockStateBase \
            net.minecraft.client.player.LocalPlayer ; do
            echo "=================== $c"
            javap -cp "$J" -public "$c" 2>&1 | grep -iE "class |interface |DayTime|getDayTime|isDay|isNight|isDark|clock|Time\(|destroy|ActionPacket\(|SwingPacket\(|START_|STOP_|ABORT|send\(|setDown|isDown|keyUp|keyDown|keyLeft|keyRight|keyShift|keyJump|keyAttack|isSleeping|getSleepingPos|stopSleep|EditBox\(|setResponder|setValue|getValue|setHint|setMaxLength|setFocused|setInitialFocus|addRenderableWidget|getDestroyProgress|ensureHasSent|useItemOn|interact\(|Sleep" | head -80
          done
          for p in net/minecraft/world/clock net/minecraft/world/timeline ; do
            echo "=================== package $p"; unzip -l "$J" | grep " $p/" | head -20
          done
