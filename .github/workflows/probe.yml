# Prints real Minecraft 26.3 class signatures (javap) so code can be written against them. Run manually.
name: API probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - run: gradle compileJava --no-daemon
      - name: javap
        run: |
          J=$(find ~/.gradle/caches -name '*.jar' -path '*minecraft*' -size +10M | xargs -I{} sh -c 'unzip -l "{}" 2>/dev/null | grep -q "net/minecraft/client/Minecraft.class" && echo "{}"' | head -1)
          echo "JAR=$J"
          for c in \
            net.minecraft.client.gui.GuiGraphicsExtractor \
            net.minecraft.client.gui.components.AbstractWidget \
            net.minecraft.client.gui.components.AbstractButton \
            net.minecraft.client.gui.components.Button \
            net.minecraft.client.gui.components.Tooltip \
            net.minecraft.client.gui.components.events.GuiEventListener \
            net.minecraft.client.gui.components.events.ContainerEventHandler \
            net.minecraft.client.gui.screens.Screen \
            net.minecraft.client.input.MouseButtonEvent \
            net.minecraft.client.input.InputWithModifiers \
            net.minecraft.client.resources.sounds.SimpleSoundInstance \
            net.minecraft.core.registries.BuiltInRegistries \
            net.minecraft.core.DefaultedRegistry \
            net.minecraft.resources.Identifier \
            net.minecraft.resources.ResourceLocation \
            net.minecraft.world.item.ItemStack \
            net.minecraft.client.gui.narration.NarrationElementOutput ; do
            echo "=================== $c"
            javap -cp "$J" -public "$c" 2>&1 | head -150
          done
          echo "=================== SoundEvents"
          javap -cp "$J" -public net.minecraft.sounds.SoundEvents | grep -E " (NOTE_BLOCK_PLING|NOTE_BLOCK_BASS|NOTE_BLOCK_CHIME|NOTE_BLOCK_BELL|PLAYER_LEVELUP|UI_TOAST_CHALLENGE_COMPLETE|BEACON_ACTIVATE|BEACON_DEACTIVATE|EXPERIENCE_ORB_PICKUP|AMETHYST_BLOCK_CHIME|UI_BUTTON_CLICK|VILLAGER_YES|VILLAGER_NO|VILLAGER_CELEBRATE|ANVIL_LAND);"
          echo "=================== Items"
          javap -cp "$J" -public net.minecraft.world.item.Items | grep -E "SPEAR|CHAIN|HEAVY_CORE|WIND_CHARGE|LIGHTNING_ROD|SCULK_SENSOR|ENCHANTED_BOOK|EMERALD;|MACE|NAUTILUS|WITHER_ROSE|EXPERIENCE_BOTTLE" | head -30
          echo "=================== gui packages"
          unzip -l "$J" | grep -E " net/minecraft/client/gui/(components/[A-Za-z]*Tooltip|render/|components/ScrollableLayout|components/AbstractScrollArea|components/AbstractContainerWidget)" | head -40
