# Starts the real Minecraft 26.3 client (virtual screen, software OpenGL) with the built jar and the Fabric API a player
# would download, joins a local test server, opens the mod's menu and checks the log. Result: PASS / FAIL.
# Run it from the Actions tab (Run workflow) or push to branch "launchtest".
name: Launch test

on:
  push:
    branches: [launchtest]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - run: gradle build -x test --no-daemon
      - run: |
          mkdir -p jar
          for f in build/libs/*.jar; do case "$f" in *-sources.jar|*-dev.jar) ;; *) cp "$f" jar/ ;; esac; done
          ls -la jar
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: jar/

  launch:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Virtual screen, software OpenGL, launcher
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libvulkan1 imagemagick xdotool libopenal1 pulseaudio > /dev/null
          pip install -q portablemc
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: jar
      - name: Start the game like a player would
        run: |
          mkdir -p result
          bash tools/ci/launch_test.sh "$(ls jar/*.jar | head -1)" 26.3 result
          cp game.log result/game.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-result
          path: result/
      - name: Fail the job unless the test passed
        run: |
          cat result/result.txt
          grep -q '^PASS' result/result.txt
